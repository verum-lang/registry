# =============================================================================
# verum.toml — registry cog manifest (v2.0)
# =============================================================================
# This is the registry's own cog manifest.  By the recursive
# self-application discipline (spec §13), the registry serves cogs;
# the registry IS a cog; the registry's cog is served by the
# registry — captured by the Banach self-reference witness in
# `src/main.vr`.
# =============================================================================

[cog]
name        = "verum-registry"
version     = "2.0.0"
edition     = "2025"
authors     = ["Verum Language Team"]
description = "The canonical Verum package registry — vcogs.io reference implementation"
license     = "Apache-2.0"
repository  = "https://github.com/verum-lang/registry"
homepage    = "https://vcogs.io"
keywords    = ["registry", "package-manager", "transparency-log"]
categories  = ["development-tools"]

[language]
profile = "application"

# =============================================================================
# Dependencies — composed against the enriched stdlib at every layer
# =============================================================================

[dependencies]
# All stdlib facilities — single dependency on the stdlib bundle.
# Specific modules used (per spec §4):
#
#   * core.configuration.toml          — manifest parsing
#   * core.cog.manifest                — typed CogManifest
#   * core.base.semver_constraint      — dependency constraints
#   * core.base.semver                 — version comparison
#   * core.base.string_distance        — typosquatting Damerau-Levenshtein
#   * core.base.ulid                   — monotonic IDs
#   * core.archive.{tar, zstd}         — source bundles
#   * core.compress.zstd               — archive decompression
#   * core.security.transparency_log   — sumdb (RFC 6962 + RFC 9162)
#   * core.security.merkle             — Merkle-tree primitive
#   * core.security.ecc.ed25519        — cog signing
#   * core.security.hash.sha256        — content addressing
#   * core.security.password_hash      — Argon2id token hashing
#   * core.security.oidc               — OIDC trusted publishing (G6)
#   * core.security.provenance         — SLSA + in-toto (G7)
#   * core.database.postgres           — connection pool + sql# meta-fn
#   * core.database.postgres.migrations — schema evolution
#   * core.net.weft                    — HTTP/2 server + middleware
#   * core.cache.redis                 — cache adapter
#   * core.search.meilisearch          — search adapter
#   * core.storage.s3                  — object store adapter
#   * core.tracing                     — OTLP traces
#   * core.metrics                     — Prometheus exposition
#   * core.time.{rfc3339, system_time} — timestamps
#   * core.encoding.{json, hex}        — encoding adapters
verum-stdlib = { version = "^0.4" }

[dev_dependencies]
# Test helpers; minimal — the registry's tests run integration-heavy.

[build_dependencies]
# None — the registry is a pure-Verum cog with no native build steps.

# =============================================================================
# Feature flags
# =============================================================================

[features]
default = ["postgres", "s3-aws", "redis-cluster"]

# Backend selection — alternative drivers can be plugged in.
postgres      = []
s3-aws        = []
s3-minio      = []
redis-cluster = []
redis-single  = []

# Optional subsystems.
oidc-trusted-publishing = []
slsa-provenance         = []
typosquatting-strict    = []

# =============================================================================
# Build profiles
# =============================================================================

[profile.dev]
tier              = "0"      # VBC interpreter for fast iteration
verification      = "runtime"
opt_level         = 0
debug             = true
debug_assertions  = true
overflow_checks   = true
lto               = false
incremental       = true
codegen_units     = 256
cbgr_checks       = "all"

[profile.release]
tier              = "2"      # AOT for production
verification      = "runtime"
opt_level         = 3
debug             = false
debug_assertions  = false
overflow_checks   = false
lto               = true
incremental       = false
codegen_units     = 16
cbgr_checks       = "audit-points"

# =============================================================================
# Distribution
# =============================================================================

[distribution]
include_source     = true

[distribution.tier2]
binaries           = true
platforms          = [
    "x86_64-linux",
    "aarch64-linux",
    "x86_64-macos",
    "aarch64-macos",
]

# =============================================================================
# Architectural intent — declared at the manifest level
# =============================================================================
#
# The registry is a `Lifecycle.Theorem("v2.0")` cog with
# CognitiveSubstrate.AnalyticDecompositional, FormalAnchoring
# .CurryHowardLawvere, ExecutabilitySense.StructuralReadiness, and a
# non-trivial SelfReferenceWitness (the registry serves itself).
# These declarations live in `src/main.vr`'s `@arch_module(...)` and
# are mirrored here as documentation for tooling that does not yet
# parse Verum source.

[meta.cve]
lifecycle              = "T"
substrate              = "analytic_decompositional"
anchoring              = "curry_howard_lawvere"
e_sense                = "structural_readiness"
self_reference_class   = "banach"
self_reference_operator = "verum_registry.services.publish_service"
self_reference_fixpoint = "verum_registry@2.0.0"
