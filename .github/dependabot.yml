version: 2
updates:
  # ---------------------------------------------------------------
  # GitHub Actions versions
  # ---------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
      - "ci"

  # ---------------------------------------------------------------
  # Docker base image (Dockerfile FROM lines)
  # ---------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
      - "docker"
