name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mon 04:00 UTC — weekly fresh-CVE rescan against unchanged code.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Trivy filesystem scan — vulnerable dependencies + secrets
  # ---------------------------------------------------------------
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'  # Report but don't fail the build; SARIF goes to GitHub Security tab.

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs

  # ---------------------------------------------------------------
  # Trivy image scan — built docker image
  # ---------------------------------------------------------------
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build registry image
        run: docker build -t verum-registry:ci .

      - name: Run Trivy on built image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'verum-registry:ci'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image

  # ---------------------------------------------------------------
  # OWASP-stripe header check — runs against deployed registry
  # ---------------------------------------------------------------
  headers:
    name: OWASP-stripe header check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Boot registry stack
        run: docker compose up -d
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/live >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done; exit 1
      - name: Check security headers
        run: |
          set -euo pipefail
          probe=$(curl -fsSI http://localhost:8080/api/v2/cogs/list)
          echo "$probe"
          for h in \
            "content-security-policy" \
            "strict-transport-security" \
            "x-content-type-options" \
            "x-frame-options" \
            "referrer-policy"; do
            if ! echo "$probe" | grep -i "^${h}:" >/dev/null; then
              echo "::error::missing required OWASP header: ${h}"
              exit 1
            fi
          done
          echo "✓ all OWASP-stripe headers present"
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ---------------------------------------------------------------
  # SBOM generation — verum publish path
  # ---------------------------------------------------------------
  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install verum-toolchain
        run: |
          curl -fsSL https://verum-lang.org/install.sh | bash -s -- --version stable
          echo "$HOME/.verum/bin" >> "$GITHUB_PATH"
      - name: Generate SPDX 2.3 SBOM
        run: verum sbom --format spdx-2.3 --output target/sbom.spdx.json
      - name: Generate CycloneDX 1.5 SBOM
        run: verum sbom --format cyclonedx-1.5 --output target/sbom.cyclonedx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ github.sha }}
          path: target/sbom.*.json
          retention-days: 90

  # ---------------------------------------------------------------
  # Argon2id parameter compliance — pin OWASP 2024 floor
  # ---------------------------------------------------------------
  argon2id-params:
    name: Argon2id parameter compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify OWASP-tuned profile is the registry default
        run: |
          set -euo pipefail
          # The registry MUST instantiate Argon2id with the Sensitive
          # profile (m≥19MiB, t≥2, p=1).  Anything else gets blocked.
          if ! grep -qE 'Argon2idProfile\.Sensitive' src/services/auth_service.vr; then
            echo "::error::auth_service.vr does not use Argon2idProfile.Sensitive"
            exit 1
          fi
          # And the OWASP floor constants must match the cheatsheet.
          mem=$(grep -oE 'memory_kib:[[:space:]]+[0-9_]+' \
                  ../verum/core/security/kdf/argon2.vr \
                  | head -n 1 | grep -oE '[0-9_]+' | tr -d _)
          time=$(grep -oE 'iterations:[[:space:]]+[0-9]+' \
                   ../verum/core/security/kdf/argon2.vr \
                   | head -n 1 | grep -oE '[0-9]+')
          echo "Sensitive profile: m=${mem} KiB, t=${time}"
          if [[ "${mem}" -lt 19456 ]]; then
            echo "::error::Sensitive m=${mem} below OWASP 2024 floor 19456 KiB"
            exit 1
          fi
          if [[ "${time}" -lt 2 ]]; then
            echo "::error::Sensitive t=${time} below OWASP 2024 floor 2"
            exit 1
          fi
          echo "✓ Argon2id parameters comply with OWASP 2024"

  # ---------------------------------------------------------------
  # Dependency review — block PRs introducing CVE-tagged deps
  # ---------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: 'high'
          comment-summary-in-pr: on-failure
