name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VERUM_LOG: warn

jobs:
  # ---------------------------------------------------------------
  # Static gate — verum check + lint + parse audit
  # ---------------------------------------------------------------
  static-gate:
    name: Static gate (verum check + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache verum-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.verum
            target/.verum-cache
          key: verum-toolchain-${{ runner.os }}-${{ hashFiles('verum.toml') }}
          restore-keys: |
            verum-toolchain-${{ runner.os }}-

      - name: Install verum-toolchain
        run: |
          curl -fsSL https://verum-lang.org/install.sh | bash -s -- --version stable
          echo "$HOME/.verum/bin" >> "$GITHUB_PATH"

      - name: verum --version
        run: verum --version

      - name: verum check (parse + typecheck)
        run: verum check --strict

      - name: verum lint (anti-pattern catalog)
        run: verum lint --all-targets

  # ---------------------------------------------------------------
  # Unit + integration test suite
  # ---------------------------------------------------------------
  test:
    name: Test suite (unit + integration)
    runs-on: ubuntu-latest
    needs: [static-gate]
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: verum
          POSTGRES_PASSWORD: verum
          POSTGRES_DB: registry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verum -d registry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

      meilisearch:
        image: getmeili/meilisearch:v1.6
        env:
          MEILI_MASTER_KEY: ci-search-key
          MEILI_NO_ANALYTICS: "true"
        ports: ['7700:7700']

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: verum-ci
          MINIO_ROOT_PASSWORD: verum-ci-secret
          MINIO_DEFAULT_BUCKETS: registry-test
        ports: ['9000:9000']

    env:
      DATABASE_URL: postgres://verum:verum@localhost:5432/registry_test
      REDIS_URL: redis://localhost:6379/0
      SEARCH_URL: http://localhost:7700
      SEARCH_KEY: ci-search-key
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: registry-test
      STORAGE_ACCESS_KEY: verum-ci
      STORAGE_SECRET_KEY: verum-ci-secret

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache verum-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.verum
            target/.verum-cache
          key: verum-toolchain-${{ runner.os }}-${{ hashFiles('verum.toml') }}
          restore-keys: |
            verum-toolchain-${{ runner.os }}-

      - name: Install verum-toolchain
        run: |
          curl -fsSL https://verum-lang.org/install.sh | bash -s -- --version stable
          echo "$HOME/.verum/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        run: verum run --bin migrate-up
        timeout-minutes: 5

      - name: verum test --release (unit + integration)
        run: verum test --release --jobs 2
        timeout-minutes: 30

  # ---------------------------------------------------------------
  # Architecture-as-Type audit gate
  # ---------------------------------------------------------------
  ats-v-audit:
    name: ATS-V audit gate (40-AP catalog + corpus invariants)
    runs-on: ubuntu-latest
    needs: [static-gate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache verum-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.verum
          key: verum-toolchain-${{ runner.os }}-${{ hashFiles('verum.toml') }}
      - name: Install verum-toolchain
        run: |
          curl -fsSL https://verum-lang.org/install.sh | bash -s -- --version stable
          echo "$HOME/.verum/bin" >> "$GITHUB_PATH"
      - name: verum audit --bundle (full corpus)
        run: verum audit --bundle --gate
      - name: verum audit --self
        run: verum audit --self
      - name: Upload audit-bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-bundle-${{ github.sha }}
          path: target/audit/bundle.json
          retention-days: 30

  # ---------------------------------------------------------------
  # Docker compose smoke — full stack startup
  # ---------------------------------------------------------------
  docker-compose-smoke:
    name: Docker compose smoke
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build registry
      - name: Boot stack
        run: docker compose up -d
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/live >/dev/null 2>&1; then
              echo "registry healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "registry never became healthy"
          docker compose logs registry
          exit 1
      - name: Smoke — readiness probe
        run: curl -fsS http://localhost:8080/health/ready
      - name: Smoke — version probe
        run: curl -fsS http://localhost:8080/health/version
      - name: Smoke — audit endpoint
        run: curl -fsS http://localhost:8080/api/audit/lifecycle
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
