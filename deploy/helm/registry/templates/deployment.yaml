apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verum-registry.fullname" . }}
  labels:
    {{- include "verum-registry.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "verum-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Re-roll pods when ConfigMap content changes (otherwise the
        # mounted volume keeps the new content but the in-process
        # config reader doesn't reload).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "verum-registry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "verum-registry.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: registry
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Configuration values from ConfigMap
            - name: REGISTRY_HOST
              value: {{ .Values.config.registryHost | quote }}
            - name: METRICS_HOST
              value: {{ .Values.config.metricsHost | quote }}
            - name: VERUM_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: TUF_METADATA_PATH
              value: {{ .Values.tuf.metadataPath | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
          envFrom:
            # Database / Redis / S3 / Search credentials live in an
            # operator-owned Secret referenced by name.
            - secretRef:
                name: {{ .Values.externalSecretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/verum-registry/config.toml
              subPath: config.toml
              readOnly: true
            - name: tuf-root
              mountPath: {{ .Values.tuf.metadataPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/verum
      volumes:
        - name: config
          configMap:
            name: {{ include "verum-registry.fullname" . }}-config
        - name: tuf-root
          configMap:
            name: {{ .Values.tuf.rootMetadataConfigMap }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
