{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "verum-registry.fullname" . }}
  labels:
    {{- include "verum-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "verum-registry.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
    # Inbound HTTP from ingress controller + Prometheus scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # DNS — required for any external lookup.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Application-level egress (postgres / redis / s3 / sigstore / OIDC / etc.)
    {{- with .Values.networkPolicy.egressAllowed }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
