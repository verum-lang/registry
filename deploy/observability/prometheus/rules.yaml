groups:
  # ---------------------------------------------------------------
  # Recording rules — pre-aggregated SLI series
  # ---------------------------------------------------------------
  - name: verum-registry.recording
    interval: 30s
    rules:
      - record: vr:request_rate:5m
        expr: sum(rate(http_requests_total{job="verum-registry"}[5m])) by (handler, method)

      - record: vr:request_error_rate:5m
        expr: sum(rate(http_requests_total{job="verum-registry",status=~"5.."}[5m])) by (handler, method)

      - record: vr:availability_ratio:30d
        expr: |
          1 - (
            sum(rate(http_requests_total{job="verum-registry",status=~"5.."}[30d]))
            /
            clamp_min(sum(rate(http_requests_total{job="verum-registry"}[30d])), 1)
          )

      - record: vr:request_latency_p99:5m
        expr: histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket{job="verum-registry"}[5m]))
            by (handler, method, le))

      - record: vr:request_latency_p99:30m
        expr: histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket{job="verum-registry"}[30m]))
            by (handler, method, le))

      - record: vr:publish_latency_p99:5m
        expr: histogram_quantile(0.99,
          sum(rate(verum_registry_publish_duration_seconds_bucket[5m])) by (le))

      - record: vr:search_latency_p99:5m
        expr: histogram_quantile(0.99,
          sum(rate(verum_registry_search_duration_seconds_bucket[5m])) by (le))

      - record: vr:audit_latency_p99:5m
        expr: histogram_quantile(0.99,
          sum(rate(verum_registry_audit_duration_seconds_bucket[5m])) by (le))

      - record: vr:db_query_latency_p99:5m
        expr: histogram_quantile(0.99,
          sum(rate(verum_registry_db_query_duration_seconds_bucket[5m])) by (operation, le))

      - record: vr:cache_hit_ratio:5m
        expr: |
          sum(rate(verum_registry_cache_hits_total[5m]))
          /
          clamp_min(sum(rate(verum_registry_cache_lookups_total[5m])), 1)

  # ---------------------------------------------------------------
  # SLO error-budget burn rate (multi-window multi-burn-rate)
  # ---------------------------------------------------------------
  - name: verum-registry.slo
    interval: 1m
    rules:
      # Availability SLO: 99.9% over 30d (budget = 0.1%)
      - record: vr:slo_availability:burn_rate_1h
        expr: |
          (1 - vr:availability_ratio:30d offset 0m)
          / 0.001  # error-budget = 0.1%
          # Numerator = current error rate. Burn 1.0 = on-track.
      - record: vr:slo_availability:burn_rate_6h
        expr: |
          (1 - avg_over_time(vr:availability_ratio:30d[6h]))
          / 0.001

      # Publish latency SLO: p99 < 5s
      - record: vr:slo_publish_p99_under_5s:5m
        expr: vr:publish_latency_p99:5m < bool 5

      # Search latency SLO: p99 < 200ms
      - record: vr:slo_search_p99_under_200ms:5m
        expr: vr:search_latency_p99:5m < bool 0.2

      # Audit latency SLO: p99 < 2s
      - record: vr:slo_audit_p99_under_2s:5m
        expr: vr:audit_latency_p99:5m < bool 2
